name: Serendipity Digest

# Her Pazartesi 06:00 UTC'de yeni bir "Kesif Fisi" uretir, gorulmus-hafizasini
# (state.json) commit'ler ve sonucu GitHub Pages'te yayinlar. Elle de tetiklenebilir.
on:
  schedule:
    - cron: "0 6 * * MON"
  workflow_dispatch: {}

# Pages'e deploy + state.json commit icin gerekli izinler
permissions:
  contents: write
  pages: write
  id-token: write
  models: read     # ucretsiz GitHub Models cikarimi (yem katmani)
  issues: write    # fisten gelen oy issue'larini okuyup kapatmak icin

# Ayni anda tek deploy kossun
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install feedparser anthropic

      - name: Geri bildirimleri topla
        # Fisten gelen "oy" etiketli issue'lari state.json'a isler ve kapatir.
        # Issue yoksa sessizce gecer; fis uretimi buna bagli degil.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collect_feedback.py

      - name: Fisi uret
        env:
          # Yem katmani icin (opsiyonel). Repo Settings > Secrets'ta
          # ANTHROPIC_API_KEY tanimliysa abstract'lar merak-acici yeme cevrilir;
          # yoksa ham feed ozeti kullanilir (fis yine uretilir).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OpenAlex "polite pool" iletisim adresi (opsiyonel). Kodda
          # durmasin diye secret'tan gelir; yoksa istekler yine calisir.
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          # Haberci e-posta (opsiyonel). Ucu de tanimliysa fis yayinlandiktan
          # sonra kisa bir "geldi" postasi gider; yoksa adim sessizce atlanir.
          # Yem katmani icin UCRETSIZ geri dusus: ANTHROPIC_API_KEY yoksa
          # GitHub Models kullanilir (ayri anahtar/kredi gerekmez).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python digest.py --count 7

      - name: Hafizayi ve arsivi commit'le
        run: |
          git config user.name "digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json output/
          git commit -m "Yeni kesif fisi ($(date -u +%Y-%m-%d))" || echo "degisiklik yok"
          git push

      - name: Pages artifact yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
